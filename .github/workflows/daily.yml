name: daily-feed

on:
  schedule:
    # 06:17 UTC is 01:17/02:17 in New York, so today's feed is ready by morning there. "Today" is
    # FEED_TZ's date (set below), not UTC's; on the US west coast this run is still the previous
    # evening, but it builds New York's date, which has already begun.
    - cron: "17 6 * * *"
    - cron: "17 13 * * *" # 13:17 UTC, a second pass that picks up same-day recordings once posted
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let a running deploy finish; the next run queues

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m barroux_daily.build
        env:
          FEED_TZ: America/New_York
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/barroux-daily
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
